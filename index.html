<style>

:root{

  --text:#f4f1ff; --muted:#aaa4dc; --orange:#ff7a3d;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--text);font-family:var(--body);font-weight:500}
body{min-height:100vh;overflow-x:hidden;background:
  radial-gradient(900px 500px at 50% -10%,#2d2183 0,transparent 70%),
  radial-gradient(600px 400px at 100% 100%,#3a1670 0,transparent 70%),var(--bg)}
button{font-family:inherit}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 70px}

/* ---------- header ---------- */
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:400 clamp(34px,10.5vw,52px)/1.02 var(--display);margin:4px 0 20px;letter-spacing:.5px;text-shadow:0 4px 0 #0a0724,0 0 28px rgba(124,108,255,.55)}
.ctl{display:flex;gap:10px;flex:none}
.rb{width:52px;height:52px;border-radius:50%;border:0;background:#2a2078;display:grid;place-items:center;cursor:pointer;color:#59b0ff;box-shadow:0 4px 0 #170f4d}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 #170f4d}
.rb svg{width:26px;height:26px}
.rb.off{color:#6a64a5}
.rb.off .on-only{display:none}
.rb:focus-visible,.go:focus-visible,.tab:focus-visible,.cell:focus-visible,.clear:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* ---------- input ---------- */
input[type=text]{width:100%;background:var(--ink);border:2px solid #2b2278;border-radius:22px;color:var(--text);font:600 22px var(--body);padding:16px 22px;outline:none}

.go{width:100%;margin-top:12px;border:0;border-radius:22px;background:linear-gradient(#ff9356,#ff7a3d);color:#2a1000;font:400 25px var(--display);padding:17px;cursor:pointer;box-shadow:0 6px 0 #c9531d;transition:transform .08s,box-shadow .08s;letter-spacing:.5px}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 #c9531d}
.go:disabled{filter:saturate(.7);cursor:wait}
.tip{margin:10px 4px 0;color:var(--muted);font-size:14px;text-align:center}

/* ---------- kartu ---------- */
.cardwrap{position:relative;margin-top:22px;border-radius:36px;box-shadow:0 0 38px -8px var(--glow,transparent);transition:box-shadow .5s}
.ring{position:absolute;inset:-5px;border-radius:41px;overflow:hidden;opacity:0;transition:opacity .3s;pointer-events:none}
.ring b{position:absolute;left:50%;top:50%;width:170%;aspect-ratio:1;margin:-85% 0 0 -85%;background:conic-gradient(var(--rgb));animation:spin 2.2s linear infinite;will-change:transform}
.cardwrap.gacha .ring,.cardwrap.rgbglow .ring{opacity:1}
.char .sp{width:100%;height:100%}
.card{position:relative;overflow:hidden;background:var(--card);border-radius:34px;padding:22px 16px 24px;text-align:center;z-index:1}
.nm{font:400 clamp(28px,9vw,44px)/1.1 var(--display);min-height:1.2em;word-break:break-word;text-transform:uppercase;position:relative;z-index:2}
.rgb{background:linear-gradient(90deg,var(--rgb));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:rgbmove 2.4s linear infinite}
.badge{display:inline-block;margin-top:6px;padding:3px 16px;border-radius:99px;font:400 15px var(--display);letter-spacing:1px;border:2px solid currentColor;position:relative;z-index:2;min-height:30px}
.badge.rgb{border-color:#fff;-webkit-text-fill-color:transparent}

.stage{position:relative;height:290px;margin:4px 0 8px;display:grid;place-items:center}
.rays{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;opacity:0;transition:opacity .4s;--ray:#ff2d55aa;

.rays.on{opacity:.9;animation:spin 7s linear infinite}

.char{position:relative;z-index:1;width:210px;height:260px}
.char svg{width:100%;height:100%;overflow:visible;display:block}

.char.rgbskin svg{animation:hue 2.2s linear infinite}
.char.glitch svg{animation:glitch .5s steps(2) infinite}

.counter{position:relative;z-index:2;display:flex;gap:10px;width:min(100%,330px);margin:8px auto 0;padding:10px;border:5px solid #c8cbe8;border-radius:28px;background:#120d38}

.digit{flex:1;height:108px;border-radius:14px;background:linear-gradient(#1c1556,#0b0824);display:grid;place-items:center;font:400 76px/1 var(--display);color:#fff}

.digit.spin span{color:#ff4d6d;animation:rgbtxt .6s linear infinite}
@keyframes rgbtxt{0%{color:#ff2d55}17%{color:#ff9a00}33%{color:#ffe600}50%{color:#00e676}67%{color:#00b0ff}83%{color:#d500f9}100%{color:#ff2d55}}

.info{font:700 18px var(--body);margin:10px 0 4px}
.say{color:var(--muted);font-size:19px;margin:0 auto;max-width:380px;line-height:1.3;min-height:2.6em}
.meter{height:10px;border-radius:99px;background:#150f42;margin:16px 6px 0;overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--rgb));transition:width .9s cubic-bezier(.2,.9,.3,1)}
.reveal{transition:opacity .45s,transform .45s}
.hide{opacity:0;transform:translateY(8px)}

/* ---------- tab ---------- */

.tab{flex:1;border:0;border-radius:18px;padding:13px 8px;background:var(--card2);color:var(--muted);font:400 16px var(--display);cursor:pointer}
.tab[aria-selected=true]{background:#fff;color:#1b1450}
.panel{margin-top:14px}
.panel[hidden]{display:none}
.row{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:20px;padding:10px 14px;margin-bottom:8px}
.row.me{outline:3px solid var(--orange)}

.mini svg{width:100%;height:100%;overflow:visible}
.who{flex:1;min-width:0}
.who b{display:block;font:400 17px var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.who small{color:var(--muted);font-size:14px}
.sc{font:400 26px var(--display)}
.empty{color:var(--muted);text-align:center;padding:22px 10px;line-height:1.35}
.clear{display:block;margin:12px auto 0;background:none;border:2px solid #4a4486;color:var(--muted);border-radius:14px;padding:8px 18px;font:600 14px var(--body);cursor:pointer}
.note{color:var(--muted);font-size:14px;margin:0 2px 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cell{background:var(--card2);border:0;color:inherit;border-radius:20px;padding:12px 8px;text-align:center;cursor:pointer}
.cell:active{transform:scale(.97)}
.cell.me{outline:3px solid var(--orange)}
.cell{min-width:0}
.cell .mini{width:76px;height:95px;margin:0 auto 6px}
.cell b{display:block;font:400 15px/1.2 var(--display);text-transform:uppercase}
.cell small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.cell .try{display:inline-block;margin-top:7px;padding:2px 12px;border-radius:99px;background:#2e2486;color:#cfc9ff;font-size:13px;font-weight:700}

.row,.cell{content-visibility:auto;contain-intrinsic-size:auto 66px}
.cell{contain-intrinsic-size:auto 230px}
/* ---------- lapisan efek ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
#flash.go{animation:flash .7s ease-out}
#edge{position:fixed;inset:0;pointer-events:none;z-index:44;opacity:0;transition:opacity .5s}
#edge i{position:absolute;inset:0;opacity:0;animation:edgefade 2.4s linear infinite}
#edge i:nth-child(1){box-shadow:inset 0 0 50px 8px #ff2d55}
#edge i:nth-child(2){box-shadow:inset 0 0 50px 8px #00e676;animation-delay:-.8s}
#edge i:nth-child(3){box-shadow:inset 0 0 50px 8px #4d7cff;animation-delay:-1.6s}
@keyframes edgefade{0%,100%{opacity:0}50%{opacity:1}}
body.gacha #edge{opacity:.9}
body.danger #edge i{box-shadow:inset 0 0 70px 20px #ff0022;animation:pulse .6s ease-in-out infinite}
body.danger #edge i:nth-child(n+2){display:none}
#dim{position:fixed;inset:0;pointer-events:none;z-index:45;opacity:0;transition:opacity .8s;background:radial-gradient(circle at 50% 45%,rgba(0,0,0,.15) 0,rgba(0,0,0,.88) 85%)}
body.danger #dim{opacity:1}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:70;pointer-events:none;opacity:0;padding:0 10px}
#banner.show{animation:bn var(--bms,2.2s) both}
#bt{font:400 clamp(44px,15vw,92px)/1 var(--display);color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.45),0 0 30px rgba(255,255,255,.6);display:inline-block}
#bt.warn{color:#ff2a45;animation:blink .35s steps(2) infinite}
#bt.mega{font-size:clamp(46px,16vw,100px);-webkit-text-stroke:2px rgba(0,0,0,.35);animation:rgbmove 1.2s linear infinite,wob .12s linear infinite}
#bs{margin-top:10px;font:700 clamp(16px,4.6vw,22px) var(--body);color:#fff;text-shadow:0 2px 8px #000}
.wrap.quake{animation:quake .5s linear var(--qn,1)}

/* ---------- animasi ---------- */
@keyframes ang{to{--ang:360deg}}
@keyframes rgbmove{to{background-position:300% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-7px,4px) rotate(-6deg)}50%{transform:translate(6px,-5px) rotate(5deg)}75%{transform:translate(-5px,-3px) rotate(-4deg)}100%{transform:translate(4px,4px) rotate(4deg)}}
@keyframes pop{0%{transform:scale(.1) rotate(-16deg);opacity:0}60%{transform:scale(1.28) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(3px,-2px) skewX(3deg)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,1px) skewX(-3deg)}}
@keyframes flash{0%{opacity:var(--fo,.85)}100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{50%{opacity:.15}}
@keyframes bn{0%{opacity:0;transform:scale(.3) rotate(-6deg)}8%{opacity:1;transform:scale(1.3) rotate(2deg)}16%{transform:scale(1) rotate(0)}85%{opacity:1}100%{opacity:0;transform:scale(1.12)}}
@keyframes quake{0%,100%{transform:translate(0)}12%{transform:translate(-9px,6px)}32%{transform:translate(8px,-7px)}52%{transform:translate(-7px,-5px)}72%{transform:translate(6px,6px)}90%{transform:translate(-3px,2px)}}
@media (prefers-reduced-motion:reduce){
  .rgb,.rays.on,.rays.on.rgb,.char.idle,.char.glitch svg,.char.rgbskin svg,#edge,.cardwrap::before,.gacha .counter{animation:none}
  .wrap.quake{animation:none}
}
</style>
</head>

function wingsF(C,cols){
  let s='';
  for(const sd of [-1,1]) cols.forEach((col,i)=>{
    const L=94-i*10, phi=(10+i*19)*Math.PI/180, dx=sd*Math.cos(phi), dy=-Math.sin(phi), sx=100+sd*30, sy=112;
    const tx=sx+dx*L, ty=sy+dy*L, mx=sx+dx*L*.5, my=sy+dy*L*.5, px=-dy*13, py=dx*13;
    s+=`<path d="M${sx} ${sy} Q${mx+px} ${my+py} ${tx} ${ty} Q${mx-px} ${my-py} ${sx} ${sy}Z" fill="${X(col)}" stroke="#fff" stroke-opacity=".55" stroke-width="1.2" opacity=".95"/>`;
  });
  return s;
}

}

const SPEC_DEF={sk:'f0c27b',g:'tee',c:'3b6fdc,455a64,ffd54f',f:'smile'};
const _sc=new Map();
function skinSVG(t,opt={}){
  const k=t+'|'+(opt.aura!==false?1:0)+'|'+(opt.uid||'a');
  let v=_sc.get(k); if(!v){ v=skinSVGRaw(t,opt); _sc.set(k,v); }
  return v;
}
const _sp=new Set();
function miniSkin(t){
  if(!_sp.has(t)){
    _sp.add(t);
    const inner=skinSVG(t,{aura:false,uid:'m'+t}).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');
    $('#sprite').insertAdjacentHTML('beforeend',`<symbol id="sk${t}" viewBox="0 0 200 250" overflow="visible">${inner}</symbol>`);
  }
  return `<svg viewBox="0 0 200 250" style="overflow:visible"><use href="#sk${t}"/></svg>`;
}
function skinSVGRaw(t, opt={}){
  const aura=opt.aura!==false, uid=opt.uid||'a';
  if (t===TIERS.length-1) return specialSVG(uid,!aura);
  const S=Object.assign({},SPEC_DEF,TIERS[t][2]), cs=S.c.split(',');
  const C={sk:'#'+S.sk,cp:S.cp||cs[2],c1:cs[0],c2:cs[1],c3:cs[2],hk:S.hk||cs[2],hc:S.hc||'3e2723',tx:S.tx,pt:S.pt,au:S.au||cs[2]};
  const gm=GM[S.g]||{}; C.lx=gm.lx||50; C.rx=gm.rx||150; C.hy=gm.y||164;
  let s=`<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skin ${TIERS[t][0]}" style="overflow:visible">`;
  if(aura){
    s+=`<defs><radialGradient id="d${uid}" cx=".5" cy=".42" r=".7"><stop offset="0" stop-color="${X(C.au)}" stop-opacity=".55"/><stop offset="1" stop-color="${sh(C.au,-.78)}" stop-opacity=".95"/></radialGradient><clipPath id="c${uid}"><circle cx="100" cy="128" r="112"/></clipPath></defs>`;
    s+=`<circle cx="100" cy="128" r="112" fill="url(#d${uid})"/>`;
    if(S.bg&&BG[S.bg]) s+=`<g clip-path="url(#c${uid})">${BG[S.bg](C)}</g>`;
    s+=`<circle cx="100" cy="128" r="112" fill="none" stroke="${X(C.au)}" stroke-width="3" opacity=".85"/>`;
  }
  s+=`<ellipse cx="100" cy="230" rx="52" ry="7" fill="#000" opacity=".28"/>`;
  if(S.b&&BK[S.b]) s+=BK[S.b](C);
  if(S.hr&&HRB[S.hr]) s+=HRB[S.hr](S.hc||C.hc);
  if(S.hat&&HB[S.hat]) s+=HB[S.hat](C);
  s+=G[S.g](C);
  s+=bx(75,42,50,50,C.sk,10);
  s+=bx(70,60,6,14,C.sk,2)+bx(124,60,6,14,C.sk,2);
  if(S.hr&&HR[S.hr]) s+=HR[S.hr](S.hc||C.hc);
  s+=(FC[S.f]||FC.smile)(C);
  if(S.hat&&HT[S.hat]) s+=HT[S.hat](C);
  if(S.q&&PR[S.q]) s+=G0(C.lx,C.hy,PR[S.q](C));
  if(S.p&&PR[S.p]) s+=G0(C.rx,C.hy,PR[S.p](C));
  if(S.fx&&FX[S.fx]) s+=FX[S.fx](C);
  return s+'</svg>';
}

function specialSVG(u, mini){

  let s=`<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skin Impossible" style="overflow:visible">`;

  this.tone({at:t,f:mf(ch[[0,1,2,1][s%4]]+(s>=8?12:0)),d:.09,type:'square',v:.045,bus:B});
  const L=LEAD[step]; if(L) this.tone({at:t,f:mf(L),d:.24,type:'square',v:.06,a:.01,bus:B});

function impossibleBlast(cx0,cy0){
  const rain8=Array.from({length:10},rc);
  for(let i=0;i<12;i++) setTimeout(()=>{ bolt(R()*W,-10,W*(.15+R()*.7),H*(.45+R()*.4)); flash('#cfe8ff',.4); Au.boom(.35); },500+i*360);
  flash('#fff',1); Au.impossible();
  banner('IMPOSSIBLE','Mustahil. Kamu menembus semua batas.',4800,'mega');
  quake(14);
  burst(cx0,cy0,200,{colors:rain8,spd:17,life:90});
  for(let i=0;i<5;i++) setTimeout(()=>ring(cx0,cy0,rc(),Math.max(W,H)*.8),i*180);
  for(let i=0;i<16;i++) setTimeout(()=>{ const p=rnd(); burst(p.x,p.y,95,{colors:rain8,spd:13,life:80}); ring(p.x,p.y,rc(),380); if(i%3===0) flash(rc(),.35); },300+i*250);
  for(let i=0;i<11;i++) setTimeout(()=>rocket(W*(.08+R()*.84),rain8),400+i*320);
  for(let i=0;i<5;i++) setTimeout(()=>confetti(90,rain8.concat(['#ffd54f','#fff'])),i*700);
  const rain=setInterval(()=>{ for(let k=0;k<6;k++) P({shape:'star',x:R()*W,y:-10,vx:(R()-.5)*2,vy:3+R()*4,g:.05,drag:.998,s:6+R()*8,c:pick(['#ffd54f','#fff',rc(),rc()]),max:220}); },80);
  setTimeout(()=>clearInterval(rain),8000);
}

/* ================= ELEMEN ================= */
const elName=$('#name'), elGo=$('#go'), elChar=$('#char'), elNm=$('#nm'), cw=$('#cw'), rays=$('#rays');
const elTier=$('#tier'), elInfo=$('#info'), elSay=$('#say'), elBar=$('#bar'), elBadge=$('#badge'), counter=$('#counter');
counter.innerHTML='<div class="digit dim"><span>0</span></div>'.repeat(3);
const digits=[...counter.children];
elChar.innerHTML=skinSVG(0,{uid:'ph'});
const hideables=[elTier,elInfo,elSay,elBadge];
hideables.forEach(e=>e.classList.add('reveal'));

function setDigits(arr,spin){
  digits.forEach((d,i)=>{ d.firstChild.textContent=arr[i]; d.classList.toggle('spin',!!spin[i]); d.classList.remove('dim'); });
}
function paintFinal(score){
  const p=String(score).padStart(3,'0'); let lead=true;
  digits.forEach((d,i)=>{
    d.firstChild.textContent=p[i]; d.classList.remove('spin');
    if(p[i]!=='0') lead=false;
    d.classList.toggle('dim',lead&&i<2);
  });
}
function charClasses(t){
  elChar.className='char';
  if(t===49) elChar.classList.add('rgbskin'); else if(t===43) elChar.classList.add('glitch');
}
function setBeam(r){
  if(r==null||r>=5){ rays.className='rays on rgb'; rays.style.removeProperty('--ray'); return; }
  rays.className='rays on'; rays.style.setProperty('--ray',RARITY[r].color+'bb');
}

/* ================= PAPAN SKOR ================= */
const KEY='nilai-nama-board-v2';
let board=[], mem=[];
function load(){ try{ board=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ board=mem; } if(!Array.isArray(board)) board=[]; }
function save(){ mem=board; try{ localStorage.setItem(KEY,JSON.stringify(board)); }catch(e){} }
function addBoard(name,score){
  const k=norm(name);
  board=board.filter(b=>norm(b.n)!==k);
  board.push({n:name,s:score,w:Date.now()});
  board.sort((a,b)=>b.s-a.s||a.w-b.w);
  board=board.slice(0,100); save();
}
function renderBoard(meName){
  const el=$('#p-board');
  if(!board.length){ el.innerHTML='<div class="empty">Belum ada skor. Nilai satu nama dulu, nanti muncul di sini. Skor tertinggi 100.</div>'; return; }
  const me=meName?norm(meName):'';
  el.innerHTML=board.map((b,i)=>{
    const t=tierOf(b.s), cls=i<3?` g${i+1}`:'';
    return `<div class="row${norm(b.n)===me?' me':''}"><div class="rk${cls}">${i+1}</div><div class="mini">${miniSkin(t)}</div><div class="who"><b${t>=79?' class="rgb"':''}>${esc(b.n)}</b><small>${TIERS[t][0]}, tingkat ${t+1}</small></div><div class="sc">${b.s}</div></div>`;
  }).join('')+'<button class="clear" id="clr">Hapus papan skor</button>';
  $('#clr').onclick=()=>{ board=[]; save(); renderBoard(); };
}
let allBuilt=false, allActive=-1;
function renderAll(active){
  allActive=active;
  if(allBuilt) document.querySelectorAll('.cell').forEach(c=>c.classList.toggle('me',+c.dataset.t===active));
}
function buildAll(){
  if(allBuilt) return; allBuilt=true;
  const el=$('#p-all');
  el.innerHTML='<p class="note">Ketuk tingkat mana pun untuk melihat efek gacha-nya, termasuk IMPOSSIBLE.</p><div class="grid" id="gridAll"></div>';
  el.onclick=e=>{ const c=e.target.closest('.cell'); if(c) preview(+c.dataset.t); };
  const g=$('#gridAll'); let i=0;
  (function chunk(){
    let h='';
    for(let k=0;k<6&&i<N;k++,i++){
      const T=TIERS[i];
      h+=`<button class="cell${i===allActive?' me':''}" data-t="${i}"><div class="mini">${miniSkin(i)}</div><b style="color:${i>=79?'#fff':tierColor(i)}">${T[0]}</b><small>skor ${i+1}, peluang ${chance(i)}%</small><span class="try">Coba efek</span></button>`;
    }
    g.insertAdjacentHTML('beforeend',h);
    if(i<N) requestAnimationFrame(chunk);
  })();
}

/* ================= GACHA ================= */
let POOL=null;
function getPool(){
  if(POOL) return POOL;
  const ids=new Set(), n=LOW?6:10;
  while(ids.size<n) ids.add(Math.floor(R()*(N-1)));
  const tmp=document.createElement('div');
  tmp.innerHTML=[...ids].map(i=>`<div class="sp" style="display:none">${skinSVG(i,{uid:'p'+i})}</div>`).join('');
  POOL=[...tmp.children]; return POOL;
}
let busy=false;
async function gacha({name,score,persist=true}){
  if(busy) return; busy=true;
  const t=tierOf(score), r=rarOf(t), imp=r===6, rar=RARITY[r];
  Au.init(); Au.startMusic(); Au.setMusic(imp?.03:.12,.2);
  elGo.disabled=true; elGo.textContent='Mengocok...';
  $('#stage').scrollIntoView({block:'center',behavior:'smooth'});
  elNm.textContent=name.toUpperCase();
  hideables.forEach(e=>e.classList.add('hide'));
  elBar.style.width='0';
  cw.className='cardwrap gacha'; cw.style.removeProperty('--glow');
  document.body.classList.add('gacha');
  elChar.style.opacity=''; elChar.className='char shaking';
  setBeam(null); vib([60,40,60,40,60]);
  if(imp){
    document.body.classList.add('danger');
    banner('PERINGATAN','Sesuatu yang mustahil sedang mendekat...',3600,'warn');
    Au.heartbeat(13);
  }
  const dur=[3400,3800,4200,4800,5400,6400,8600][r];
  Au.riser(dur/1000);
  const sps=getPool(); elChar.replaceChildren(...sps); sps.forEach(e=>e.style.display='none');
  let cur=0; sps[0].style.display='block';
  const _fin=document.createElement('div'); _fin.innerHTML=skinSVG(t,{uid:'f'+t}); const finNode=_fin.firstChild;
  const lockAt=[dur*.4,dur*.72], lk=[0,0], t0=performance.now(); let n=0;
  for(;;){
    const e=performance.now()-t0; if(e>=dur) break;
    if(!lk[0]&&e>=lockAt[0]){ lk[0]=1; Au.lock(0); }
    if(!lk[1]&&e>=lockAt[1]){ lk[1]=1; Au.lock(1); setBeam(r); }
    const p=String(score).padStart(3,'0');
    setDigits([0,1,2].map(i=>(i===0&&lk[0])?p[0]:(i===1&&lk[1])?p[1]:String(Math.floor(R()*10))),[!lk[0],!lk[1],true]);
    sps[cur].style.display='none'; cur=(cur+1+Math.floor(R()*(sps.length-1)))%sps.length; sps[cur].style.display='block';
    Au.tick(n++);
    await sleep(55+Math.pow(e/dur,2.2)*260);
  }
  Au.lock(2);
  const rect0=elChar.getBoundingClientRect(), cx0=rect0.left+rect0.width/2, cy0=rect0.top+rect0.height/2;
  paintFinal(score);
  if(imp){
    Au.setMusic(0,.05); elChar.style.opacity='0';
    implode(cx0,cy0,200); Au.suck();
    await sleep(850);
    elChar.style.opacity='';
  }
  elChar.replaceChildren(finNode);
  charClasses(t); void elChar.offsetWidth; elChar.classList.add('pop');
  document.body.classList.remove('danger');
  cw.className='cardwrap gacha'; /* garis RGB tetap menyala sampai akhir */
  vib([220,60,140]);

  elTier.textContent=TIERS[t][0].toUpperCase();
  elTier.classList.toggle('rgb',t>=79);
  elTier.style.color=t>=79?'':tierColor(t);
  elTier.style.textShadow=t>=79?'':(t<4?'none':`0 0 18px ${tierColor(t)}`);
  elInfo.textContent=`Tingkat ${t+1} dari ${N}, peluang ${chance(t)}%`;
  elSay.textContent=sayFor(name,t,r);
  elBadge.textContent=rar.label.toUpperCase();
  elBadge.classList.toggle('rgb',r>=5);
  elBadge.style.color=r>=5?'':rar.color;
  hideables.forEach(e=>e.classList.remove('hide'));
  elBar.style.width=((t+1)/N*100)+'%';

  if(imp) impossibleBlast(cx0,cy0); else celebrate(t,r,cx0,cy0);

  if(persist){ addBoard(name,score); renderBoard(name); renderAll(t); } else renderAll(t);

  await sleep(imp?5200:1500);
  document.body.classList.remove('gacha'); rays.className='rays';
  cw.className='cardwrap'+(r>=5?' rgbglow':''); if(r<5) cw.style.setProperty('--glow',rar.color);
  if(t!==43&&t!==49) elChar.classList.add('idle');
  Au.setMusic(Au.idle,.8);
  elGo.disabled=false; elGo.textContent='Nilai Nama'; busy=false;
}
function roll(){
  if(busy) return;
  const name=elName.value.trim();
  if(!name){ elName.classList.remove('err'); void elName.offsetWidth; elName.classList.add('err'); elName.focus(); return; }
  gacha({name,score:scoreOf(name)});
}
function preview(t){
  if(busy) return;
  const name=elName.value.trim()||TIERS[t][0];
  gacha({name,score:t+1,persist:false});
}
elGo.addEventListener('click',()=>{
  if(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function') DeviceMotionEvent.requestPermission().catch(()=>{});
  roll();
});
elName.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); elName.blur(); elGo.click(); } });
elName.addEventListener('input',()=>elName.classList.remove('err'));

/* guncang HP */
let lastShake=0;
let _dm=0;
addEventListener('devicemotion',e=>{
  const nw=performance.now(); if(nw-_dm<120) return; _dm=nw;
  const a=e.accelerationIncludingGravity; if(!a) return;
  const m=Math.hypot(a.x||0,a.y||0,a.z||0);
  if(m>32&&Date.now()-lastShake>2500&&!busy&&elName.value.trim()){ lastShake=Date.now(); roll(); }
});

/* ================= TOMBOL SUARA & TAB ================= */
$('#btnMusic').addEventListener('click',e=>{
  Au.musicOn=!Au.musicOn; const b=e.currentTarget;
  b.classList.toggle('off',!Au.musicOn); b.setAttribute('aria-label',Au.musicOn?'Musik aktif':'Musik mati');
  if(Au.musicOn){ Au.init(); Au.startMusic(); } else Au.stopMusic();
});
$('#btnSfx').addEventListener('click',e=>{
  Au.sfxOn=!Au.sfxOn; const b=e.currentTarget;
  b.classList.toggle('off',!Au.sfxOn); b.setAttribute('aria-label',Au.sfxOn?'Efek suara aktif':'Efek suara mati');
  if(Au.sfxOn){ Au.init(); Au.tone({f:880,d:.12,type:'triangle',v:.15}); }
});
/* musik mulai setelah sentuhan pertama (aturan autoplay browser) */
addEventListener('pointerdown',()=>{ if(!Au.ctx&&Au.musicOn){ Au.init(); Au.startMusic(); } },{once:true});
document.addEventListener('visibilitychange',()=>{
  if(!Au.ctx) return;
  if(document.hidden) Au.ctx.suspend(); else Au.ctx.resume();
});
document.querySelectorAll('.tab').forEach(tb=>tb.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===tb));
  $('#p-board').hidden=tb.dataset.p!=='board';
  $('#p-all').hidden=tb.dataset.p!=='all';
  if(tb.dataset.p==='all') buildAll();
}));

load(); renderBoard(); renderAll(-1);
(window.requestIdleCallback||(f=>setTimeout(f,1200)))(()=>getPool());
</script>
</body>
